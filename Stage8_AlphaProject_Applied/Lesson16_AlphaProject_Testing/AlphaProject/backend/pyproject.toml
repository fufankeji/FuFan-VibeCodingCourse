[project]
name = "alphaproject-backend"
version = "0.1.0"
description = "A 股自动盯盘 AI 助手 · 后端（FastAPI + SQLite）"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypinyin>=0.53",
    "akshare>=1.18",
    "lark-oapi>=1.4",
    "apscheduler>=3.10",
    "openai>=2.38.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
